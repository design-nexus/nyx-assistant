[package]
name = "assistant-visual"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nyx Assistant Aura and Canvas"

[[bin]]
name = "nyx-assistant-visual"
path = "src/main.rs"

[dependencies]
assistant-core.workspace = true
assistant-omarchy.workspace = true
tokio.workspace = true
tempfile.workspace = true
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
serde_json.workspace = true
poppler-rs = "0.26"
libshumate = { version = "0.8.1", features = ["gtk_v4_18", "v1_7"] }
nyx-playback = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
plotters = { version = "0.3.7", default-features = false, features = ["line_series", "ttf"] }
plotters-cairo = "0.9"

libc = "0.2"
